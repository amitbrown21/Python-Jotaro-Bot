# Local: docker compose up -d --build
# TrueNAS: use image only; mount host config dir to /config (see README)

services:
  jotaro-bot:
    image: ghcr.io/amitbrown21/python-jotaro-bot:latest
    build: .
    hostname: discord-bot
    container_name: jotaro-bot
    restart: unless-stopped
    volumes:
      - ${CONFIG_PATH:-.}:/config:ro
